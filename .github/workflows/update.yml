name: 株価データ更新

on:
  schedule:
    # 平日 18:30(日本時間)= 09:30(UTC)
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}   # 手動実行ボタン

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: データ作成
        run: python screener.py

      - name: 公開用ファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages に公開
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 実行記録を保存(自動実行が止まらないようにするため)
        run: |
          date +'%Y-%m-%d %H:%M' > last_run.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add last_run.txt tickers.csv
          git diff --cached --quiet || git commit -m "実行記録 $(date +'%Y-%m-%d')"
          git push
