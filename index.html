<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スクリーナー">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<title>スイング・スクリーナー</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaef; --sub:#9097a5;
  --accent:#4f8cff; --up:#ff5a5f; --down:#3fb37f; --chip:#222733; --warn:#e8b04a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1 small{font-size:12px;color:var(--sub);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--text);
  border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 24px)}
details.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
details.panel>summary{list-style:none;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"＋";color:var(--sub)}
details.panel[open]>summary::after{content:"－"}
.body{padding:0 14px 14px}
.grp{border-top:1px solid var(--line);padding:10px 0}
.grp:first-child{border-top:0;padding-top:0}
.grp h3{font-size:12px;color:var(--sub);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.row label{flex:1;font-size:14px}
.range{display:flex;align-items:center;gap:6px}
input[type=number],select{background:#0f1115;color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:7px 8px;font-size:16px;width:84px;text-align:right}
select{width:auto;text-align:left}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:8px;
  padding:7px 10px;font-size:13px}
.tg button.on{background:rgba(79,140,255,.18);border-color:var(--accent);color:#cfe0ff}
.note{font-size:12px;color:var(--sub);margin:4px 0 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 10px;font-size:13px;color:var(--sub)}
.bar b{color:var(--text);font-size:15px}
.bar .r{display:flex;gap:6px;align-items:center}
.bar select{font-size:14px;padding:5px 6px}
.iconbtn{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:8px;padding:5px 9px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:600;font-size:15px;line-height:1.3}
.cd{color:var(--sub);font-size:12px;font-weight:400}
.px{text-align:right;white-space:nowrap}
.px b{font-size:16px}
.pos{color:var(--up)} .neg{color:var(--down)}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.m{background:#12151b;border-radius:8px;padding:4px 6px}
.m span{display:block;font-size:10.5px;color:var(--sub)}
.m b{font-size:13px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#232838;color:#bcc6dc}
.tag.hot{background:rgba(255,90,95,.15);color:#ff9a9d}
.links{display:none;gap:8px;margin-top:8px}
.card.open .links{display:flex}
.links a{flex:1;text-align:center;text-decoration:none;color:#cfe0ff;background:#1f2533;border-radius:8px;padding:8px 4px;font-size:13px}
.star{background:none;border:0;font-size:20px;color:#555c6b;padding:0 0 0 6px;line-height:1}
.star.on{color:var(--warn)}
.more{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px}
.msg{text-align:center;color:var(--sub);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
  background:#2b3140;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
/* チャート画面 */
#cv{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#cv.show{display:flex}
.cvh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cvh .t{flex:1;min-width:0}
.cvh .t b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvh .t span{font-size:12px;color:var(--sub)}
.x{border:0;background:var(--chip);color:var(--text);border-radius:999px;width:34px;height:34px;font-size:18px}
.cvbody{flex:1;overflow-y:auto;padding:10px 12px 20px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;color:var(--sub);padding:7px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
#chart{height:52vh;min-height:300px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lg button{border:1px solid var(--line);background:var(--chip);color:var(--sub);border-radius:999px;padding:5px 10px;font-size:12px}
.lg button.on{color:var(--text);border-color:#4a5263}
.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-top:1px dashed #262a33}
.kv:first-of-type{border-top:0}
.kv span{color:var(--sub)}
.att{font-size:11px;color:var(--sub);margin-top:10px;text-align:center}
.att a{color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>スイング・スクリーナー <small id="dt">読み込み中…</small></h1>
  <div class="chips" id="presets"></div>
</header>

<main>
  <details class="panel" id="panel">
    <summary>条件を設定</summary>
    <div class="body" id="form"></div>
  </details>

  <div class="bar">
    <div><b id="cnt">0</b> 銘柄</div>
    <div class="r">
      <select id="sort">
        <option value="vr">出来高倍率</option>
        <option value="chg">前日比</option>
        <option value="tv20">売買代金</option>
        <option value="d25">25日線乖離</option>
        <option value="rsi">RSI</option>
        <option value="f52">52週高値に近い</option>
        <option value="code">コード</option>
      </select>
      <button class="iconbtn" id="dir" aria-label="並び順">↓</button>
      <button class="iconbtn" id="copy" aria-label="コードをコピー">コピー</button>
    </div>
  </div>
  <div id="list"></div>
</main>
<div class="toast" id="toast"></div>

<div id="cv">
  <div class="cvh">
    <div class="t"><b id="cvName"></b><span id="cvSub"></span></div>
    <button class="star" id="cvStar" aria-label="監視">★</button>
    <button class="x" id="cvClose" aria-label="閉じる">×</button>
  </div>
  <div class="cvbody">
    <div class="seg" id="tf">
      <button data-tf="d" class="on">日足</button><button data-tf="w">週足</button><button data-tf="m">月足</button>
    </div>
    <div id="chart"></div>
    <div class="lg" id="layers"></div>
    <div id="cvInfo"></div>
    <div class="att">チャート: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts</a> ・ 分析は機械的な目安です</div>
  </div>
</div>

<script>
// ---------- 条件の定義 ----------
const DEFAULT = {
  mkt: ["プライム","スタンダード","グロース"], sec: "",
  pmin: "", pmax: "", tvmin: 1, chgmin: "", chgmax: "", vrmin: "",
  d25min: "", d25max: "", rsimin: "", rsimax: "", f52: "",
  nsup:false, ntl:false, nfib:false, pat:"",
  a5:false, up25:false, a75:false, po:false, h20:false, h52:false, star:false,
  sort: "vr", desc: true
};
const PRESETS = [
  {id:"vol",  name:"出来高急増",   set:{vrmin:2, chgmin:0, sort:"vr"}},
  {id:"trend",name:"上昇トレンド", set:{po:true, up25:true, sort:"tv20"}},
  {id:"dip",  name:"押し目",       set:{up25:true, a75:true, d25min:-3, d25max:2, sort:"d25", desc:false}},
  {id:"brk",  name:"52週高値更新", set:{h52:true, vrmin:1.5, sort:"vr"}},
  {id:"brk20",name:"20日高値更新", set:{h20:true, up25:true, sort:"vr"}},
  {id:"sup",  name:"サポート反発候補", set:{nsup:true, chgmin:0, sort:"tv20"}},
  {id:"tl",   name:"トレンドライン押し", set:{ntl:true, up25:true, sort:"tv20"}},
  {id:"fib",  name:"フィボ押し",   set:{nfib:true, up25:true, sort:"tv20"}},
  {id:"dbl",  name:"ダブルボトム", set:{pat:"ダブルボトム", sort:"vr"}},
  {id:"star", name:"★ 監視",       set:{star:true, tvmin:"", sort:"code", desc:false}},
];
const TOGGLES = [
  ["a5","5日線より上"],["up25","25日線が上向き"],["a75","75日線より上"],
  ["po","パーフェクトオーダー"],["h20","20日高値更新"],["h52","52週高値更新"],["star","★監視のみ"]
];

const TOGGLES2 = [["nsup","サポート付近"],["ntl","上昇トレンドライン付近"],["nfib","フィボ押し(38.2〜61.8%)"]];
const PATS = ["ダブルボトム","ダブルボトム(ブレイク)","ダブルボトム(形成中)","ダブルトップ","三角保ち合い","三角保ち合い(ブレイク)","ボックス","高値・安値切り上げ","高値・安値切り下げ"];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let S = Object.assign({}, DEFAULT, store.get("cond", {}));
let stars = new Set(store.get("stars", []));
let preset = store.get("preset", "");
let DATA = [], shown = 0, filtered = [], DATA_DATE = "";
const PAGE = 100;
const $ = id => document.getElementById(id);

// ---------- 画面 ----------
function buildPresets(){
  $("presets").innerHTML = PRESETS.map(p =>
    `<button class="chip ${preset===p.id?"on":""}" data-p="${p.id}">${p.name}</button>`).join("")
    + `<button class="chip" data-p="reset">リセット</button>`;
  $("presets").onclick = e => {
    const id = e.target.dataset.p; if(!id) return;
    if(id==="reset" || id===preset){ S = Object.assign({}, DEFAULT); preset = ""; }
    else { const p = PRESETS.find(x=>x.id===id); S = Object.assign({}, DEFAULT, p.set); preset = id; }
    buildPresets(); buildForm(); run();
  };
}

function num(key, label, unit, step){
  return `<div class="row"><label>${label}</label><div class="range">
    <input type="number" inputmode="decimal" step="${step||"any"}" data-k="${key}" value="${S[key]}">${unit||""}</div></div>`;
}
function rng(kmin, kmax, label, unit){
  return `<div class="row"><label>${label}</label><div class="range">
    <input type="number" inputmode="decimal" data-k="${kmin}" value="${S[kmin]}" placeholder="下限">〜
    <input type="number" inputmode="decimal" data-k="${kmax}" value="${S[kmax]}" placeholder="上限">${unit||""}</div></div>`;
}
function buildForm(){
  const secs = [...new Set(DATA.map(r=>r.sec))].filter(Boolean).sort();
  $("form").innerHTML = `
  <div class="grp"><h3>市場・業種</h3>
    <div class="tg" id="mkts">${["プライム","スタンダード","グロース"].map(m=>
      `<button data-m="${m}" class="${S.mkt.includes(m)?"on":""}">${m}</button>`).join("")}</div>
    <div class="row"><label>業種</label><select data-k="sec"><option value="">すべて</option>${
      secs.map(s=>`<option ${S.sec===s?"selected":""}>${s}</option>`).join("")}</select></div>
  </div>
  <div class="grp"><h3>株価・流動性</h3>
    ${rng("pmin","pmax","株価","円")}
    ${num("tvmin","売買代金(20日平均)","億円以上")}
    <p class="note">流動性の低い銘柄を外すため、初期値は1億円以上にしています。</p>
  </div>
  <div class="grp"><h3>前日の値動き</h3>
    ${rng("chgmin","chgmax","前日比","%")}
    ${num("vrmin","出来高倍率(20日平均比)","倍以上")}
  </div>
  <div class="grp"><h3>トレンド・位置</h3>
    <div class="tg" id="tgs">${TOGGLES.map(([k,l])=>
      `<button data-t="${k}" class="${S[k]?"on":""}">${l}</button>`).join("")}</div>
    ${rng("d25min","d25max","25日線からの乖離","%")}
    ${num("f52","52週高値から","%以内")}
    ${rng("rsimin","rsimax","RSI(14日)","")}
  </div>
  <div class="grp"><h3>チャート分析(日足)</h3>
    <div class="tg" id="tg2">${TOGGLES2.map(([k,l])=>
      `<button data-t="${k}" class="${S[k]?"on":""}">${l}</button>`).join("")}</div>
    <div class="row"><label>チャートパターン</label><select data-k="pat"><option value="">指定なし</option>${
      PATS.map(p=>`<option ${S.pat===p?"selected":""}>${p}</option>`).join("")}</select></div>
    <p class="note">サポート・トレンドライン付近=その線から0〜3%上。フィボ押し=直近の上昇に対して38.2〜61.8%押した位置。いずれも機械的な判定の目安です。</p>
  </div>`;
  $("form").querySelectorAll("[data-k]").forEach(el => {
    el.addEventListener(el.tagName==="SELECT" ? "change" : "input", () => {
      S[el.dataset.k] = el.value; preset = ""; buildPresets(); run();
    });
  });
  $("mkts").onclick = e => {
    const m = e.target.dataset.m; if(!m) return;
    S.mkt = S.mkt.includes(m) ? S.mkt.filter(x=>x!==m) : [...S.mkt, m];
    e.target.classList.toggle("on"); preset=""; buildPresets(); run();
  };
  $("tg2").onclick = e => {
    const k = e.target.dataset.t; if(!k) return;
    S[k] = !S[k]; e.target.classList.toggle("on"); preset=""; buildPresets(); run();
  };
  $("tgs").onclick = e => {
    const k = e.target.dataset.t; if(!k) return;
    S[k] = !S[k]; e.target.classList.toggle("on"); preset=""; buildPresets(); run();
  };
}

// ---------- 絞り込み ----------
const has = v => v !== "" && v !== null && v !== undefined && !isNaN(parseFloat(v));
const f = v => parseFloat(v);
function pass(r){
  if(!S.mkt.some(m => (r.mkt||"").includes(m))) return false;
  if(S.sec && r.sec !== S.sec) return false;
  if(has(S.pmin) && r.price < f(S.pmin)) return false;
  if(has(S.pmax) && r.price > f(S.pmax)) return false;
  if(has(S.tvmin) && !(r.tv20 >= f(S.tvmin))) return false;
  if(has(S.chgmin) && !(r.chg >= f(S.chgmin))) return false;
  if(has(S.chgmax) && !(r.chg <= f(S.chgmax))) return false;
  if(has(S.vrmin) && !(r.vr >= f(S.vrmin))) return false;
  if(has(S.d25min) && !(r.d25 >= f(S.d25min))) return false;
  if(has(S.d25max) && !(r.d25 <= f(S.d25max))) return false;
  if(has(S.rsimin) && !(r.rsi >= f(S.rsimin))) return false;
  if(has(S.rsimax) && !(r.rsi <= f(S.rsimax))) return false;
  if(has(S.f52) && !(r.f52 >= -Math.abs(f(S.f52)))) return false;
  if(S.a5 && !r.a5) return false;
  if(S.up25 && !r.up25) return false;
  if(S.a75 && !(r.d75 > 0)) return false;
  if(S.po && !r.po) return false;
  if(S.h20 && !r.h20) return false;
  if(S.h52 && !r.h52) return false;
  if(S.star && !stars.has(r.code)) return false;
  if(S.nsup && !(r.sup !== null && r.sup >= 0 && r.sup <= 3)) return false;
  if(S.ntl && !(r.tlu !== null && r.tlu >= 0 && r.tlu <= 3)) return false;
  if(S.nfib && !r.fib) return false;
  if(S.pat && !(r.pat||"").split("|").some(p => p.startsWith(S.pat))) return false;
  return true;
}
function run(){
  store.set("cond", S); store.set("preset", preset);
  $("sort").value = S.sort; $("dir").textContent = S.desc ? "↓" : "↑";
  const k = S.sort, d = S.desc ? -1 : 1;
  filtered = DATA.filter(pass).sort((a,b)=>{
    const x = a[k], y = b[k];
    if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * d;
  });
  $("cnt").textContent = filtered.length.toLocaleString();
  shown = 0; $("list").innerHTML = ""; more();
}

// ---------- 表示 ----------
const fx = (v, nd=1, sfx="") => v===null||v===undefined ? "—" : (+v).toFixed(nd) + sfx;
const sg = v => v===null||v===undefined ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "";
function card(r){
  const tags = [];
  if(r.h52) tags.push(`<span class="tag hot">52週高値</span>`);
  else if(r.h20) tags.push(`<span class="tag hot">20日高値</span>`);
  if(r.po) tags.push(`<span class="tag">PO</span>`);
  if(r.up25) tags.push(`<span class="tag">25日線↑</span>`);
  if(r.vr >= 2) tags.push(`<span class="tag hot">出来高${fx(r.vr,1)}倍</span>`);
  (r.pat||"").split("|").filter(Boolean).forEach(p => tags.push(`<span class="tag hot">${p}</span>`));
  if(r.sup!==null && r.sup>=0 && r.sup<=3) tags.push(`<span class="tag">サポート付近</span>`);
  if(r.fib) tags.push(`<span class="tag">フィボ押し</span>`);
  tags.push(`<span class="tag">${r.mkt}</span>`);
  if(r.sec) tags.push(`<span class="tag">${r.sec}</span>`);
  return `<div class="card" data-c="${r.code}">
    <div class="top">
      <div class="nm">${r.name}<br><span class="cd">${r.code}</span></div>
      <div style="display:flex;align-items:flex-start">
        <div class="px"><b>${(+r.price).toLocaleString()}</b><br><span class="${sg(r.chg)}">${r.chg>0?"+":""}${fx(r.chg,2,"%")}</span></div>
        <button class="star ${stars.has(r.code)?"on":""}" data-s="${r.code}" aria-label="監視">★</button>
      </div>
    </div>
    <div class="mets">
      <div class="m"><span>出来高倍率</span><b>${fx(r.vr,2)}</b></div>
      <div class="m"><span>売買代金</span><b>${fx(r.tv,1)}億</b></div>
      <div class="m"><span>25日乖離</span><b class="${sg(r.d25)}">${fx(r.d25,1,"%")}</b></div>
      <div class="m"><span>RSI</span><b>${fx(r.rsi,0)}</b></div>
    </div>
    <div class="tags">${tags.join("")}</div>
    <div class="links">
      <a href="#" data-chart="${r.code}" style="background:var(--accent);color:#fff">チャート分析</a>
      <a href="https://kabutan.jp/stock/chart?code=${r.code}" target="_blank" rel="noopener">株探チャート</a>
      <a href="https://finance.yahoo.co.jp/quote/${r.code}.T/chart" target="_blank" rel="noopener">Yahoo!</a>
    </div>
  </div>`;
}
function more(){
  const part = filtered.slice(shown, shown + PAGE);
  shown += part.length;
  const old = $("moreBtn"); if(old) old.remove();
  if(!filtered.length){ $("list").innerHTML = `<div class="msg">条件に合う銘柄がありません</div>`; return; }
  $("list").insertAdjacentHTML("beforeend", part.map(card).join(""));
  if(shown < filtered.length)
    $("list").insertAdjacentHTML("beforeend", `<button class="more" id="moreBtn">さらに表示(残り${filtered.length-shown})</button>`);
}
$("list").addEventListener("click", e => {
  if(e.target.id === "moreBtn") return more();
  const s = e.target.dataset.s;
  if(s){
    stars.has(s) ? stars.delete(s) : stars.add(s);
    store.set("stars", [...stars]); e.target.classList.toggle("on");
    toast(stars.has(s) ? "監視に追加" : "監視から外しました"); return;
  }
  const ch = e.target.closest("[data-chart]");
  if(ch){ e.preventDefault(); openChart(ch.dataset.chart); return; }
  if(e.target.closest("a")) return;
  const c = e.target.closest(".card"); if(c) c.classList.toggle("open");
});
$("sort").onchange = e => { S.sort = e.target.value; run(); };
$("dir").onclick = () => { S.desc = !S.desc; run(); };
$("copy").onclick = async () => {
  const txt = filtered.slice(0, 200).map(r => r.code).join("\n");
  try{ await navigator.clipboard.writeText(txt); toast(`${Math.min(filtered.length,200)}銘柄のコードをコピー`); }
  catch(e){ toast("コピーできませんでした"); }
};
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1600); }

// ---------- チャート分析 ----------
const LAYERS = [["ma","移動平均","#e8b04a"],["sr","サポート/レジスタンス","#4f8cff"],["tl","トレンドライン","#c77dff"],["fib","フィボナッチ","#4fd1c5"],["vol","出来高","#5b6475"]];
const MA = {d:[5,25,75], w:[13,26,52], m:[12,24,60]};
const MA_COL = ["#e8b04a","#4f8cff","#c77dff"];
const SHOW = {d:150, w:110, m:60};
const FIBR = ["0%","23.6%","38.2%","50%","61.8%","78.6%","100%"];
const TFN = {d:"日足", w:"週足", m:"月足"};
let CV = {code:null, data:null, tf:"d", chart:null, on:store.get("layers", {ma:true, sr:true, tl:true, fib:false, vol:true})};

const tStr = n => { const s = String(n); return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`; };
const tMs = n => Date.parse(tStr(n));
const pct = (a, b) => (a / b - 1) * 100;
const yen = v => (+v).toLocaleString(undefined, {maximumFractionDigits:1});

async function openChart(code){
  const r = DATA.find(x => x.code === code);
  CV.code = code; CV.data = null;
  $("cvName").textContent = r ? r.name : code;
  $("cvSub").textContent = r ? `${code} ・ ${r.mkt} ・ ${r.sec||""}` : code;
  $("cvStar").classList.toggle("on", stars.has(code));
  $("cvInfo").innerHTML = `<div class="msg">読み込み中…</div>`;
  $("cv").classList.add("show"); document.body.style.overflow = "hidden";
  try{
    CV.data = await (await fetch(`c/${code}.json?${DATA_DATE}`)).json();
    draw();
  }catch(e){
    $("cvInfo").innerHTML = `<div class="msg">チャートデータを読み込めませんでした</div>`;
  }
}
function closeChart(){
  $("cv").classList.remove("show"); document.body.style.overflow = "";
  if(CV.chart){ CV.chart.remove(); CV.chart = null; }
}

function draw(){
  if(!CV.data) return;
  if(typeof LightweightCharts === "undefined"){
    $("cvInfo").innerHTML = `<div class="msg">チャートの部品を読み込めませんでした。通信状況を確認してください。</div>`; return;
  }
  const tf = CV.tf, rows = CV.data[tf], a = CV.data.a[tf], on = CV.on;
  document.querySelectorAll("#tf button").forEach(b => b.classList.toggle("on", b.dataset.tf === tf));
  $("layers").innerHTML = LAYERS.map(([k,l,c]) =>
    `<button data-l="${k}" class="${on[k]?"on":""}"><i style="background:${c}"></i>${l}</button>`).join("");
  if(CV.chart) CV.chart.remove();
  const ch = LightweightCharts.createChart($("chart"), {
    autoSize: true,
    layout: {background:{color:"#0f1115"}, textColor:"#9097a5", fontSize:11},
    grid: {vertLines:{color:"#1a1e25"}, horzLines:{color:"#1a1e25"}},
    rightPriceScale: {borderColor:"#262a33"},
    timeScale: {borderColor:"#262a33", rightOffset:3},
    crosshair: {mode: 0},
    localization: {locale:"ja-JP", dateFormat:"yyyy/MM/dd"},
  });
  CV.chart = ch;
  const candle = ch.addCandlestickSeries({
    upColor:"#ff5a5f", downColor:"#3fb37f", borderUpColor:"#ff5a5f", borderDownColor:"#3fb37f",
    wickUpColor:"#ff5a5f", wickDownColor:"#3fb37f"
  });
  candle.setData(rows.map(r => ({time:tStr(r[0]), open:r[1], high:r[2], low:r[3], close:r[4]})));
  candle.priceScale().applyOptions({scaleMargins:{top:0.06, bottom: on.vol ? 0.22 : 0.06}});

  if(on.vol){
    const vs = ch.addHistogramSeries({priceScaleId:"vol", priceFormat:{type:"volume"}, lastValueVisible:false, priceLineVisible:false});
    ch.priceScale("vol").applyOptions({scaleMargins:{top:0.82, bottom:0}});
    vs.setData(rows.map(r => ({time:tStr(r[0]), value:r[5], color: r[4] >= r[1] ? "rgba(255,90,95,.45)" : "rgba(63,179,127,.45)"})));
  }
  if(on.ma){
    MA[tf].forEach((n, j) => {
      if(rows.length < n) return;
      const s = ch.addLineSeries({color:MA_COL[j], lineWidth:1, lastValueVisible:false, priceLineVisible:false, crosshairMarkerVisible:false});
      const out = []; let sum = 0;
      rows.forEach((r, i) => { sum += r[4]; if(i >= n) sum -= rows[i-n][4]; if(i >= n-1) out.push({time:tStr(r[0]), value:sum/n}); });
      s.setData(out);
    });
  }
  if(on.sr){
    a.sr.forEach(x => candle.createPriceLine({
      price:x.p, color: x.t === "s" ? "#4f8cff" : "#ff9f43", lineWidth:1, lineStyle:2,
      axisLabelVisible:true, title: `${x.t === "s" ? "サポート" : "レジスタンス"}(${x.n})`
    }));
  }
  if(on.tl){
    const first = rows[0][0];
    a.tl.forEach(t => {
      let d1 = t.d1, p1 = t.p1;
      if(d1 < first){ // 表示範囲より前から始まる線は、表示の左端から描く
        const k = (tMs(first) - tMs(t.d1)) / (tMs(t.d2) - tMs(t.d1));
        p1 = t.p1 + (t.p2 - t.p1) * k; d1 = first;
      }
      const s = ch.addLineSeries({color: t.k === "up" ? "#c77dff" : "#ff6bcb", lineWidth:2, lastValueVisible:false, priceLineVisible:false, crosshairMarkerVisible:false});
      s.setData([{time:tStr(d1), value:p1}, {time:tStr(t.d2), value:t.p2}]);
    });
  }
  if(on.fib && a.fib){
    a.fib.lv.forEach((p, i) => candle.createPriceLine({
      price:p, color: i === 2 || i === 4 ? "#4fd1c5" : "rgba(79,209,197,.55)", lineWidth:1, lineStyle:1,
      axisLabelVisible: i >= 2 && i <= 4, title:`Fib ${FIBR[i]}`
    }));
  }
  ch.timeScale().setVisibleLogicalRange({from: Math.max(0, rows.length - SHOW[tf]), to: rows.length + 2});
  info(rows, a);
}

function info(rows, a){
  const close = rows[rows.length-1][4], tf = CV.tf;
  const pats = a.pat.length ? a.pat.map(p => `<span class="tag hot">${p}</span>`).join(" ") : `<span class="cd">はっきりしたパターンは検出されませんでした</span>`;
  const sup = a.sr.filter(x => x.t === "s"), res = a.sr.filter(x => x.t === "r");
  const lvRow = (x, lab) => `<div class="kv"><span>${lab}(接触${x.n}回)</span><b>${yen(x.p)}円 <small class="${sg(pct(x.p, close))}">${pct(x.p, close) > 0 ? "+" : ""}${pct(x.p, close).toFixed(1)}%</small></b></div>`;
  const tls = a.tl.map(t => `<div class="kv"><span>${t.k === "up" ? "上昇トレンドライン" : "下降トレンドライン"}の現在値</span><b>${yen(t.p2)}円 <small class="${sg(pct(t.p2, close))}">${pct(t.p2, close) > 0 ? "+" : ""}${pct(t.p2, close).toFixed(1)}%</small></b></div>`).join("")
    || `<div class="kv"><span>条件に合うラインはありません</span><b></b></div>`;
  let fib = `<div class="kv"><span>計算できません</span><b></b></div>`;
  if(a.fib){
    const f = a.fib;
    fib = `<div class="kv"><span>基準</span><b>${f.dir === "up" ? "上昇の押し目" : "下落の戻り"}(${yen(f.lo)}〜${yen(f.hi)}円)</b></div>`
      + f.lv.map((p, i) => i === 0 || i === 6 ? "" : `<div class="kv"><span>${FIBR[i]}${f.dir === "up" ? "押し" : "戻し"}</span><b>${yen(p)}円 <small class="${sg(pct(p, close))}">${pct(p, close) > 0 ? "+" : ""}${pct(p, close).toFixed(1)}%</small></b></div>`).join("");
  }
  $("cvInfo").innerHTML = `
    <div class="box"><h4>チャートパターン(${TFN[tf]})</h4><div class="tags">${pats}</div></div>
    <div class="box"><h4>レジスタンス(上値の目安)</h4>${res.slice().reverse().map(x => lvRow(x, "レジスタンス")).join("") || `<div class="kv"><span>上に目立つ節目なし</span><b></b></div>`}
      <div class="kv"><span>現在値</span><b>${yen(close)}円</b></div>
      ${sup.map(x => lvRow(x, "サポート")).join("") || `<div class="kv"><span>下に目立つ節目なし</span><b></b></div>`}</div>
    <div class="box"><h4>トレンドライン</h4>${tls}</div>
    <div class="box"><h4>フィボナッチ</h4>${fib}</div>`;
}

$("tf").onclick = e => { const t = e.target.dataset.tf; if(t){ CV.tf = t; draw(); } };
$("layers").onclick = e => { const b = e.target.closest("[data-l]"); if(!b) return; CV.on[b.dataset.l] = !CV.on[b.dataset.l]; store.set("layers", CV.on); draw(); };
$("cvClose").onclick = closeChart;
$("cvStar").onclick = e => {
  const s = CV.code; stars.has(s) ? stars.delete(s) : stars.add(s);
  store.set("stars", [...stars]); e.target.classList.toggle("on");
  document.querySelectorAll(`[data-s="${s}"]`).forEach(b => b.classList.toggle("on", stars.has(s)));
  toast(stars.has(s) ? "監視に追加" : "監視から外しました");
};

// ---------- 読み込み ----------
fetch("data.json?" + Date.now()).then(r => r.json()).then(j => {
  DATA_DATE = j.date;
  DATA = j.rows.map(a => Object.fromEntries(j.keys.map((k,i)=>[k,a[i]])));
  $("dt").textContent = `${j.date} 終値 ・ ${j.count.toLocaleString()}銘柄`;
  buildPresets(); buildForm(); run();
}).catch(() => {
  $("dt").textContent = "";
  $("list").innerHTML = `<div class="msg">データがまだありません。<br>GitHubの「Actions」で更新を実行してください。</div>`;
});
</script>
</body>
